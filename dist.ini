name = eBay-Client-OpenAPI3
version = 0.01
author = Oodler 577 <oodler@cpan.org>
license = Perl_5
copyright_holder = Brett Estrade
copyright_year = 2026

[PruneCruft]
[ManifestSkip]
[MetaYAML]
[MetaJSON]
[License]
[ExtraTests]
[ExecDir]
[MakeMaker]
[Manifest]

[Prereqs]
perl = 5.016
Dispatch::Fu = 0
HTTP::Status = 0
HTTP::Tiny = 0
JSON = 0
JSON::XS = 0
MIME::Base64 = 0
Text::ASCII::Convert = 0
URI = 0
Util::H2O::More = 0.3.4
YAML = 0

[Prereqs / TestRequires]
-phase = test
-relationship = requires
File::Temp = 0
Test::More = 0

[MetaResources]
repository.type = git
repository.url = https://github.com/oodler577/p5-eBay-Client-OpenAPI3.git
repository.web = https://github.com/oodler577/p5-eBay-Client-OpenAPI3
bugtracker.web = https://github.com/oodler577/p5-eBay-Client-OpenAPI3/issues

[GatherDir]
exclude_filename = dist.ini
exclude_filename = Makefile
exclude_match = ^\.github/
exclude_match = ^\.git/
exclude_match = ^cover_db/
exclude_match = ^local/
exclude_match = ^tmp/
exclude_match = ^releases/
exclude_match = \.bak$
exclude_match = \.swp$
exclude_match = ~$

[TestRelease]
[ConfirmRelease]
[UploadToCPAN]
